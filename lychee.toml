# Formát pro Lychee v0.24.x (lychee-action@v2).
verbose = "info"
no_progress = true
include_fragments = "full"
accept = ["200..=299", "403", "429"]

# mailto/tel se neověřují; Formspree je POST endpoint (GET vrací 405).
# .online zatím 404 (špatné názvy souborů v klidnepodnikani-online); po opravě přesměrování lze vyloučení zrušit.
exclude = ['^mailto:', '^tel:', 'formspree.io', 'klidnepodnikani.online']
exclude_path = ['_site']
